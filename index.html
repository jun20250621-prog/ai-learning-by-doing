<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning by Doing - 後端工程師的 LLM 應用入門</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .course-card { cursor: pointer; }
        .course-card:hover { transform: translateY(-4px); border-color: #00d4ff; }
        .quiz-container { background: #1e2a3a; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .quiz-question { margin-bottom: 20px; }
        .quiz-question h4 { margin-bottom: 10px; color: #00d4ff; }
        .quiz-option { display: block; padding: 12px 16px; margin: 8px 0; background: #16213e; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .quiz-option:hover { border-color: #00d4ff; }
        .quiz-option.selected { border-color: #00d4ff; background: #1a2a4a; }
        .quiz-option.correct { border-color: #00c853; background: #1a3a2a; }
        .quiz-option.wrong { border-color: #ff5252; background: #3a1a1a; }
        .quiz-result { padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .quiz-result.show { display: block; }
        .quiz-result.pass { background: #1a3a2a; border: 1px solid #00c853; }
        .quiz-result.fail { background: #3a1a1a; border: 1px solid #ff5252; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; margin: 5px; }
        .btn-primary { background: #00d4ff; color: #0f0f1a; }
        .btn-primary:hover { background: #00b8d9; }
        .tab-buttons { display: flex; gap: 10px; margin: 20px 0; align-items: center; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border-radius: 8px; background: #16213e; color: #eaeaea; border: 1px solid #2a2a4a; cursor: pointer; }
        .tab-btn.active { background: #00d4ff; color: #0f0f1a; border-color: #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .video-btn { margin-left: auto; background: #ff0000; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .video-btn:hover { background: #cc0000; }
        .course-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .course-tag { background: #2a2a4a; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🤖 AI Learning by Doing</h1>
            <p class="subtitle">後端工程師的 LLM 應用入門 — 每週一個小專案</p>
            <p style="color: #00d4ff; margin-top: 10px;">🎯 使用 Google Gemini API（免費額度）</p>
            <button onclick="showAdmin()" style="margin-top: 15px; background: #2a2a4a; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">⚙️ 管理課程</button>
        </div>
    </header>

    <main class="container">
        <section class="progress-section">
            <div class="progress-info">
                <span>學習進度</span>
                <span id="progress-text">0 / 28 天完成</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </section>

        <section class="courses-section" id="courses-section">
            <h2>📚 課程列表</h2>
            <div class="courses-grid" id="courses-grid">
                <!-- 課程卡片由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 課程詳情由 JavaScript 動態生成 -->
        <section id="course-container"></section>
    </main>

    <footer>
        <div class="container">
            <p>🚀 每週一個小專案，30-45 分鐘可完成</p>
            <p class="copyright">© 2026 AI Learning by Doing</p>
        </div>
    </footer>

    <!-- 管理課程 Modal -->
    <div id="admin-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow: auto;">
        <div style="background: #1a1a2e; max-width: 800px; margin: 50px auto; padding: 30px; border-radius: 12px; max-height: 90vh; overflow-y: auto;">
            <h2 style="color: #00d4ff;">⚙️ 管理課程</h2>
            <button onclick="showAddForm()" style="background: #00c853; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin: 10px 5px 10px 0;">➕ 新增課程</button>
            <button onclick="closeAdmin()" style="background: #666; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">✖ 關閉</button>
            
            <div id="course-list" style="margin-top: 20px;"></div>
            
            <!-- 新增課程表單 -->
            <div id="add-form" style="display: none; margin-top: 30px; padding: 20px; background: #16213e; border-radius: 8px;">
                <h3 style="color: #00d4ff;">➕ 新增課程</h3>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">天數 (day):</label>
                    <input type="number" id="new-week" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px;">
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">標題 (title):</label>
                    <input type="text" id="new-title" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px;">
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">描述 (desc):</label>
                    <textarea id="new-desc" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px; rows: 2"></textarea>
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">標籤 (tags，多個用逗號分隔):</label>
                    <input type="text" id="new-tags" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px;">
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">時間 (time):</label>
                    <input type="text" id="new-time" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px;">
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">YouTube 影片連結:</label>
                    <input type="text" id="new-video" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px;" placeholder="https://youtu.be/xxx">
                </div>
                <div style="margin: 15px 0;">
                    <label style="display: block; margin-bottom: 5px;">教學內容 (HTML):</label>
                    <textarea id="new-content" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px; rows: 5"></textarea>
                </div>
                <button onclick="addCourse()" style="background: #00d4ff; color: #0f0f1a; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">💾 儲存課程</button>
                <button onclick="document.getElementById('add-form').style.display='none'" style="background: #666; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer;">取消</button>
            </div>
        </div>
    </div>

    <script src="courses.js"></script>
    <script>
    const STORAGE_KEY = 'ai-learning-progress';
    const COURSES_KEY = 'ai-courses-data';
    
    // 從 localStorage 載入課程，沒有則用預設
    function getCourses() {
        const stored = localStorage.getItem(COURSES_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
        // 儲存預設課程到 localStorage
        localStorage.setItem(COURSES_KEY, JSON.stringify(COURSES));
        return COURSES;
    }
    
    function saveCourses(courses) {
        localStorage.setItem(COURSES_KEY, JSON.stringify(courses));
    }
    
    function showAdmin() {
        document.getElementById('admin-modal').style.display = 'block';
        renderCourseList();
    }
    
    function closeAdmin() {
        document.getElementById('admin-modal').style.display = 'none';
        document.getElementById('add-form').style.display = 'none';
    }
    
    function showAddForm() {
        // 清空表單
        document.getElementById('new-week').value = '';
        document.getElementById('new-week').disabled = false;
        document.getElementById('new-title').value = '';
        document.getElementById('new-desc').value = '';
        document.getElementById('new-tags').value = '';
        document.getElementById('new-time').value = '';
        document.getElementById('new-video').value = '';
        document.getElementById('new-content').value = '';
        document.querySelector('#add-form h3').textContent = '➕ 新增課程';
        document.getElementById('add-form').style.display = 'block';
    }
    
    function renderCourseList() {
        const courses = getCourses();
        const list = document.getElementById('course-list');
        list.innerHTML = courses.map(c => `
            <div style="background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong>Day ${c.day}</strong> - ${c.title}
                    <div style="font-size: 0.85rem; color: #888;">${c.tags.join(', ')} | ${c.time}</div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button onclick="editCourse(${c.day})" style="background: #ff9800; color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">✏️ 編輯</button>
                    <button onclick="deleteCourse(${c.day})" style="background: #ff5252; color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">🗑️ 刪除</button>
                </div>
            </div>
        `).join('');
    }
    
    function addCourse() {
        const day = parseInt(document.getElementById('new-week').value);
        const title = document.getElementById('new-title').value;
        const desc = document.getElementById('new-desc').value;
        const tags = document.getElementById('new-tags').value.split(',').map(t => t.trim());
        const time = document.getElementById('new-time').value;
        const video = document.getElementById('new-video').value;
        const content = document.getElementById('new-content').value;
        
        if (!day || !title) {
            alert('請填寫天數和標題');
            return;
        }
        
        const courses = getCourses();
        
        // 檢查天數是否已存在
        const existing = courses.findIndex(c => c.day === day);
        if (existing >= 0) {
            courses[existing] = { day, title, desc, tags, time, video, content, quiz: [] };
        } else {
            courses.push({ day, title, desc, tags, time, video, content, quiz: [] });
        }
        
        // 按天數排序
        courses.sort((a, b) => a.day - b.day);
        
        saveCourses(courses);
        renderCourseList();
        
        // 清空表單
        document.getElementById('new-week').value = '';
        document.getElementById('new-week').disabled = false;
        document.getElementById('new-title').value = '';
        document.getElementById('new-desc').value = '';
        document.getElementById('new-tags').value = '';
        document.getElementById('new-time').value = '';
        document.getElementById('new-video').value = '';
        document.getElementById('new-content').value = '';
        
        document.getElementById('add-form').style.display = 'none';
        renderCourses();
        updateProgress();
        alert('課程已儲存！');
    }
    
    function editCourse(day) {
        const courses = getCourses();
        const course = courses.find(c => c.day === day);
        if (!course) return;
        
        // 填入表單
        document.getElementById('new-week').value = course.day;
        document.getElementById('new-week').disabled = true;
        document.getElementById('new-title').value = course.title;
        document.getElementById('new-desc').value = course.desc;
        document.getElementById('new-tags').value = course.tags.join(', ');
        document.getElementById('new-time').value = course.time;
        document.getElementById('new-video').value = course.video || '';
        document.getElementById('new-content').value = course.content || '';
        
        document.getElementById('add-form').style.display = 'block';
        document.querySelector('#add-form h3').textContent = '✏️ 編輯課程 (Day ' + day + ')';
    }
    
    function deleteCourse(day) {
        if (!confirm('確定要刪除 Day ' + day + ' 嗎？')) return;
        
        let courses = getCourses();
        courses = courses.filter(c => c.day !== day);
        saveCourses(courses);
        renderCourseList();
        renderCourses();
        updateProgress();
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        renderCourses();
        updateProgress();
    });
    
    function getProgress() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }
    
    function saveProgress(completedIds) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(completedIds));
        updateProgress();
    }
    
    function updateProgress() {
        const completed = getProgress();
        const total = COURSES.length;
        const percent = Math.round((completed.length / total) * 100);
        document.getElementById('progress-text').textContent = completed.length + ' / ' + total + ' 週完成';
        document.getElementById('progress-fill').style.width = percent + '%';
    }
    
    function renderCourses() {
        const courses = getCourses();
        const grid = document.getElementById('courses-grid');
        grid.innerHTML = courses.map(course => `
            <div class="course-card" onclick="showCourse(${course.day})">
                <div class="week-number">Day ${course.day}</div>
                <h3>${course.title}</h3>
                <p>${course.desc}</p>
                <div class="course-meta">
                    <span class="course-tag">${course.tags.join(' · ')}</span>
                    <span>⏱ ${course.time}</span>
                </div>
            </div>
        `).join('');
    }
    
    function showCourse(dayId) {
        const courses = getCourses();
        const course = courses.find(c => c.day === dayId);
        if (!course) return;
        
        const container = document.getElementById('course-container');
        const completed = getProgress();
        const isCompleted = completed.includes(dayId);
        
        container.innerHTML = `
            <section class="course-content" style="display: block;">
                <button class="back-btn" onclick="showHome()">← 返回列表</button>
                <div class="course-detail">
                    <h2>Day ${course.day} - ${course.title}</h2>
                    <div class="meta"><span>⏱ ${course.time}</span><span>🏷️ ${course.tags.join(' · ')}</span></div>
                    <div class="tab-buttons">
                        <button class="tab-btn active" onclick="switchTab(${dayId}, 'content', this)">📖 教學</button>
                        <button class="tab-btn" onclick="switchTab(${dayId}, 'quiz', this)">📝 測驗</button>
                        ${course.video ? `<a href="${course.video}" target="_blank" class="video-btn">▶ 影片</a>` : ''}
                    </div>
                    <div class="tab-content active" id="tab-${dayId}-content">
                        ${course.content}
                    </div>
                    <div class="tab-content" id="tab-${dayId}-quiz">
                        <div class="quiz-container" id="quiz-${dayId}">
                            ${course.quiz.map((q, i) => `
                                <div class="quiz-question" data-answer="${q.answer}">
                                    <h4>${i + 1}. ${q.q}</h4>
                                    ${q.options.map((opt, j) => `
                                        <label class="quiz-option" onclick="selectOption(this, ${dayId}, ${j})">${opt}</label>
                                    `).join('')}
                                </div>
                            `).join('')}
                            <button class="btn btn-primary" onclick="submitQuiz(${dayId})">提交答案</button>
                            <div class="quiz-result" id="result-${dayId}"></div>
                        </div>
                    </div>
                    <button class="complete-btn ${isCompleted ? 'completed' : ''}" onclick="toggleComplete(${dayId})">
                        ${isCompleted ? '✓ 已完成' : '標記為完成'}
                    </button>
                </div>
            </section>
        `;
        
        document.getElementById('courses-section').style.display = 'none';
        window.scrollTo(0, 0);
    }
    
    function showHome() {
        document.getElementById('courses-section').style.display = 'block';
        document.getElementById('course-container').innerHTML = '';
    }
    
    function toggleComplete(dayId) {
        let completed = getProgress();
        const btn = document.querySelector('.complete-btn');
        if (completed.includes(dayId)) {
            completed = completed.filter(c => c !== dayId);
            btn.textContent = '標記為完成';
            btn.classList.remove('completed');
        } else {
            completed.push(dayId);
            btn.textContent = '✓ 已完成';
            btn.classList.add('completed');
        }
        saveProgress(completed);
    }

    function switchTab(dayId, tab, btn) {
        const content = document.getElementById('course-container');
        content.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        content.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById('tab-' + weekId + '-' + tab).classList.add('active');
    }

    let selectedAnswers = {};
    
    function selectOption(element, dayId, optionIndex) {
        const question = element.closest('.quiz-question');
        question.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selectedAnswers[dayId + '-' + question.dataset.answer] = optionIndex;
    }
    
    function submitQuiz(dayId) {
        const courses = getCourses();
        const course = courses.find(c => c.day === dayId);
        const container = document.getElementById('quiz-' + dayId);
        const questions = container.querySelectorAll('.quiz-question');
        let correct = 0;
        
        questions.forEach((q, i) => {
            const answer = parseInt(q.dataset.answer);
            const selected = selectedAnswers[dayId + '-' + answer];
            q.querySelectorAll('.quiz-option').forEach((opt, j) => {
                if (j === answer) opt.classList.add('correct');
                else if (j === selected && selected !== answer) opt.classList.add('wrong');
            });
            if (selected === answer) correct++;
        });
        
        const result = document.getElementById('result-' + dayId);
        const pass = correct >= questions.length * 0.7;
        result.className = 'quiz-result show ' + (pass ? 'pass' : 'fail');
        result.innerHTML = `得分：${correct}/${questions.length} (${pass ? '✅ 通過' : '❌ 需再學習'})`;
    }
    </script>
</body>
</html>
