<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning by Doing - 後端工程師的 LLM 應用入門</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .course-card { cursor: pointer; }
        .course-card:hover { transform: translateY(-4px); border-color: #00d4ff; }
        .quiz-container { background: #1e2a3a; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .quiz-question { margin-bottom: 20px; }
        .quiz-question h4 { margin-bottom: 10px; color: #00d4ff; }
        .quiz-option { display: block; padding: 12px 16px; margin: 8px 0; background: #16213e; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .quiz-option:hover { border-color: #00d4ff; }
        .quiz-option.selected { border-color: #00d4ff; background: #1a2a4a; }
        .quiz-option.correct { border-color: #00c853; background: #1a3a2a; }
        .quiz-option.wrong { border-color: #ff5252; background: #3a1a1a; }
        .quiz-result { padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .quiz-result.show { display: block; }
        .quiz-result.pass { background: #1a3a2a; border: 1px solid #00c853; }
        .quiz-result.fail { background: #3a1a1a; border: 1px solid #ff5252; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; margin: 5px; }
        .btn-primary { background: #00d4ff; color: #0f0f1a; }
        .btn-primary:hover { background: #00b8d9; }
        .tab-buttons { display: flex; gap: 10px; margin: 20px 0; align-items: center; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border-radius: 8px; background: #16213e; color: #eaeaea; border: 1px solid #2a2a4a; cursor: pointer; }
        .tab-btn.active { background: #00d4ff; color: #0f0f1a; border-color: #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .video-btn { margin-left: auto; background: #ff0000; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .video-btn:hover { background: #cc0000; }
        .course-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .course-tag { background: #2a2a4a; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🤖 AI Learning by Doing</h1>
            <p class="subtitle">後端工程師的 LLM 應用入門 — 每週一個小專案</p>
            <p style="color: #00d4ff; margin-top: 10px;">🎯 使用 Google Gemini API（免費額度）</p>
        </div>
    </header>

    <main class="container">
        <section class="progress-section">
            <div class="progress-info">
                <span>學習進度</span>
                <span id="progress-text">0 / 8 週完成</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </section>

        <section class="courses-section" id="courses-section">
            <h2>📚 課程列表</h2>
            <div class="courses-grid" id="courses-grid">
                <!-- 課程卡片由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 課程詳情由 JavaScript 動態生成 -->
        <section id="course-container"></section>
    </main>

    <footer>
        <div class="container">
            <p>🚀 每週一個小專案，30-45 分鐘可完成</p>
            <p class="copyright">© 2026 AI Learning by Doing</p>
        </div>
    </footer>

    <script src="courses.js"></script>
    <script>
    const STORAGE_KEY = 'ai-learning-progress';
    
    document.addEventListener('DOMContentLoaded', () => {
        renderCourses();
        updateProgress();
    });
    
    function getProgress() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }
    
    function saveProgress(completedIds) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(completedIds));
        updateProgress();
    }
    
    function updateProgress() {
        const completed = getProgress();
        const total = COURSES.length;
        const percent = Math.round((completed.length / total) * 100);
        document.getElementById('progress-text').textContent = completed.length + ' / ' + total + ' 週完成';
        document.getElementById('progress-fill').style.width = percent + '%';
    }
    
    function renderCourses() {
        const grid = document.getElementById('courses-grid');
        grid.innerHTML = COURSES.map(course => `
            <div class="course-card" onclick="showCourse(${course.week})">
                <div class="week-number">Week ${course.week}</div>
                <h3>${course.title}</h3>
                <p>${course.desc}</p>
                <div class="course-meta">
                    <span class="course-tag">${course.tags.join(' · ')}</span>
                    <span>⏱ ${course.time}</span>
                </div>
            </div>
        `).join('');
    }
    
    function showCourse(weekId) {
        const course = COURSES.find(c => c.week === weekId);
        if (!course) return;
        
        const container = document.getElementById('course-container');
        const completed = getProgress();
        const isCompleted = completed.includes(weekId);
        
        container.innerHTML = `
            <section class="course-content" style="display: block;">
                <button class="back-btn" onclick="showHome()">← 返回列表</button>
                <div class="course-detail">
                    <h2>Week ${course.week} - ${course.title}</h2>
                    <div class="meta"><span>⏱ ${course.time}</span><span>🏷️ ${course.tags.join(' · ')}</span></div>
                    <div class="tab-buttons">
                        <button class="tab-btn active" onclick="switchTab(${weekId}, 'content', this)">📖 教學</button>
                        <button class="tab-btn" onclick="switchTab(${weekId}, 'quiz', this)">📝 測驗</button>
                        ${course.video ? `<a href="${course.video}" target="_blank" class="video-btn">▶ 影片</a>` : ''}
                    </div>
                    <div class="tab-content active" id="tab-${weekId}-content">
                        ${course.content}
                    </div>
                    <div class="tab-content" id="tab-${weekId}-quiz">
                        <div class="quiz-container" id="quiz-${weekId}">
                            ${course.quiz.map((q, i) => `
                                <div class="quiz-question" data-answer="${q.answer}">
                                    <h4>${i + 1}. ${q.q}</h4>
                                    ${q.options.map((opt, j) => `
                                        <label class="quiz-option" onclick="selectOption(this, ${weekId}, ${j})">${opt}</label>
                                    `).join('')}
                                </div>
                            `).join('')}
                            <button class="btn btn-primary" onclick="submitQuiz(${weekId})">提交答案</button>
                            <div class="quiz-result" id="result-${weekId}"></div>
                        </div>
                    </div>
                    <button class="complete-btn ${isCompleted ? 'completed' : ''}" onclick="toggleComplete(${weekId})">
                        ${isCompleted ? '✓ 已完成' : '標記為完成'}
                    </button>
                </div>
            </section>
        `;
        
        document.getElementById('courses-section').style.display = 'none';
        window.scrollTo(0, 0);
    }
    
    function showHome() {
        document.getElementById('courses-section').style.display = 'block';
        document.getElementById('course-container').innerHTML = '';
    }
    
    function toggleComplete(weekId) {
        let completed = getProgress();
        const btn = document.querySelector('.complete-btn');
        if (completed.includes(weekId)) {
            completed = completed.filter(c => c !== weekId);
            btn.textContent = '標記為完成';
            btn.classList.remove('completed');
        } else {
            completed.push(weekId);
            btn.textContent = '✓ 已完成';
            btn.classList.add('completed');
        }
        saveProgress(completed);
    }

    function switchTab(weekId, tab, btn) {
        const content = document.getElementById('course-container');
        content.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        content.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById('tab-' + weekId + '-' + tab).classList.add('active');
    }

    let selectedAnswers = {};
    
    function selectOption(element, weekId, optionIndex) {
        const question = element.closest('.quiz-question');
        question.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selectedAnswers[weekId + '-' + question.dataset.answer] = optionIndex;
    }
    
    function submitQuiz(weekId) {
        const course = COURSES.find(c => c.week === weekId);
        const container = document.getElementById('quiz-' + weekId);
        const questions = container.querySelectorAll('.quiz-question');
        let correct = 0;
        
        questions.forEach((q, i) => {
            const answer = parseInt(q.dataset.answer);
            const selected = selectedAnswers[weekId + '-' + answer];
            q.querySelectorAll('.quiz-option').forEach((opt, j) => {
                if (j === answer) opt.classList.add('correct');
                else if (j === selected && selected !== answer) opt.classList.add('wrong');
            });
            if (selected === answer) correct++;
        });
        
        const result = document.getElementById('result-' + weekId);
        const pass = correct >= questions.length * 0.7;
        result.className = 'quiz-result show ' + (pass ? 'pass' : 'fail');
        result.innerHTML = `得分：${correct}/${questions.length} (${pass ? '✅ 通過' : '❌ 需再學習'})`;
    }
    </script>
</body>
</html>
